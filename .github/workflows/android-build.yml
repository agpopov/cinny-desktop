name: Corp Android build and emulator checks
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit to build
        required: true
        default: corp
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve source to immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SOURCE_REF: ${{ inputs.source_ref }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BUILD_SOURCE_REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android command-line tools
        run: |
          sdk_root="$RUNNER_TEMP/cinny-android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
          cache-on-failure: true
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install and test web dependencies
        run: |
          npm ci
          npm ci --prefix cinny
          npm run test:unread --prefix cinny
          npm run test:mentions --prefix cinny
          npm run typecheck --prefix cinny
      - name: Create disposable preview signing key
        run: |
          debug_key="$RUNNER_TEMP/cinny-android-preview.keystore"
          keytool -genkeypair -keystore "$debug_key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 3650
          echo "CINNY_ANDROID_DEBUG_KEYSTORE=$debug_key" >> "$GITHUB_ENV"
      - name: Generate pinned Tauri Android project
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          node scripts/prepare-android.mjs
          mkdir -p android-artifacts
          git rev-parse HEAD > android-artifacts/desktop-source.txt
          git -C cinny rev-parse HEAD > android-artifacts/web-source.txt
      - name: Build release APK and AAB
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run tauri -- android build --apk --aab --target aarch64 armv7 x86_64 --ci
      - name: Build installable emulator preview
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run tauri -- android build --debug --apk --target x86_64 --ci
      - name: Prepare optimized installable preview with debug signing
        run: |
          unsigned_apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "$unsigned_apk" android-artifacts/Cinny_4.12.11_android-preview.apk
          "$tools/apksigner" sign --ks "$CINNY_ANDROID_DEBUG_KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android android-artifacts/Cinny_4.12.11_android-preview.apk
          "$tools/apksigner" verify --verbose android-artifacts/Cinny_4.12.11_android-preview.apk
          "$tools/zipalign" -c -P 16 4 android-artifacts/Cinny_4.12.11_android-preview.apk
          "$tools/aapt" dump badging android-artifacts/Cinny_4.12.11_android-preview.apk > android-artifacts/android-package.txt
          head -n 8 android-artifacts/android-package.txt
          grep "versionCode='4012011' versionName='4.12.11'" android-artifacts/android-package.txt
      - name: Collect packages and generated native source
        if: always()
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} android-artifacts/ \; || true
          tar -czf android-artifacts/generated-android-source.tar.gz --exclude=build --exclude=.gradle src-tauri/gen/android
      - name: Install Android WebView test client
        run: python3 -m pip install websocket-client==1.9.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-artifacts/Cinny_4.12.11_android-preview.apk
            adb shell am start -n in.cinny.app/.MainActivity
            sleep 25
            adb shell pidof in.cinny.app
            adb shell uiautomator dump /sdcard/release-window.xml
            adb pull /sdcard/release-window.xml android-artifacts/android-release-startup.xml
            adb exec-out screencap -p > android-artifacts/android-release-startup.png
            ANDROID_TEST_VARIANT=native-release python3 tests/e2e/android_native.py
            adb shell am force-stop in.cinny.app
            adb install -r android-artifacts/app-universal-debug.apk
            adb shell am start -n in.cinny.app/.MainActivity
            sleep 25
            adb shell pidof in.cinny.app
            python3 tests/e2e/android_native.py
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml android-artifacts/android-startup.xml
            adb exec-out screencap -p > android-artifacts/android-startup.png
            adb logcat -d > android-artifacts/android-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*in.cinny.app|Process: in.cinny.app.*PID' android-artifacts/android-logcat.txt
      - name: Android checksums
        if: always()
        run: python3 -c 'import hashlib,pathlib; d=pathlib.Path("android-artifacts"); (d/"SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in sorted(d.iterdir()) if p.suffix in [".apk",".aab"]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinny-4.12.11-android-preview
          path: android-artifacts/
          if-no-files-found: error
