name: Corp Android build and emulator checks
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source tag or commit (empty means the selected workflow commit)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve source to immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BUILD_SOURCE_REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android command-line tools
        run: |
          sdk_root="$RUNNER_TEMP/cinny-android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
          cache-on-failure: true
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install and test web dependencies
        run: |
          npm ci
          node tests/android-prepare.test.mjs
          npm ci --prefix cinny
          rustc --test tests/wry_frame_guard.rs -o "$RUNNER_TEMP/wry-frame-tests"
          "$RUNNER_TEMP/wry-frame-tests"
          npm run test:unread:source --prefix cinny
          npm run test:mentions --prefix cinny
          npm run test:media --prefix cinny
          npm run test:stickers --prefix cinny
          npm run test:key-export --prefix cinny
          npm run test:p1 --prefix cinny
          npm run test:p2 --prefix cinny
          npm run test:routes --prefix cinny
          npm run test:clipboard --prefix cinny
          npm run test:editor-links --prefix cinny
          npm run test:client-fixes --prefix cinny
          npm run typecheck --prefix cinny
      - name: Create disposable preview signing key
        run: |
          debug_key="$RUNNER_TEMP/cinny-android-preview.keystore"
          keytool -genkeypair -keystore "$debug_key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 3650
          echo "CINNY_ANDROID_DEBUG_KEYSTORE=$debug_key" >> "$GITHUB_ENV"
      - name: Generate pinned Tauri Android project
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          node scripts/prepare-android.mjs
          node -e 'const fs=require("fs"); const v=require("./package.json").version; const [a,b,c]=v.split(".").map(Number); fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_ANDROID_VERSION=${v}\nEXPECTED_ANDROID_VERSION_CODE=${a*1000000+b*1000+c}\n`);'
          mkdir -p android-artifacts
          git rev-parse HEAD > android-artifacts/desktop-source.txt
          git -C cinny rev-parse HEAD > android-artifacts/web-source.txt
      - name: Build release APK and AAB
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run tauri -- android build --apk --aab --target aarch64 armv7 x86_64 --ci
      - name: Build smaller release APKs for individual architectures
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run tauri -- android build --split-per-abi --apk --target aarch64 armv7 x86_64 --ci
      - name: Build installable emulator preview
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run tauri -- android build --debug --apk --target x86_64 --ci
      - name: Sign Android release APK and bundle with persistent key
        env:
          CINNY_ANDROID_KEYSTORE_BASE64: ${{ secrets.CINNY_ANDROID_KEYSTORE_BASE64 }}
          CINNY_ANDROID_STORE_PASSWORD: ${{ secrets.CINNY_ANDROID_STORE_PASSWORD }}
          CINNY_ANDROID_KEY_PASSWORD: ${{ secrets.CINNY_ANDROID_KEY_PASSWORD }}
          CINNY_ANDROID_KEY_ALIAS: ${{ secrets.CINNY_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$CINNY_ANDROID_KEYSTORE_BASE64"
          release_key="$RUNNER_TEMP/cinny-android-release.p12"
          trap 'rm -f "$release_key"' EXIT
          umask 077
          printf '%s' "$CINNY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_key"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=android-artifacts/Cinny_4.13.2_android.apk
          aab=android-artifacts/Cinny_4.13.2_android-release.aab
          for pair in universal:android arm64:android-arm64 arm:android-arm32 x86_64:android-x86_64; do
            flavor="${pair%%:*}"
            suffix="${pair#*:}"
            python3 scripts/sign-android-apk.py \
              --input "src-tauri/gen/android/app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk" \
              --output "android-artifacts/Cinny_4.13.2_$suffix.apk" \
              --keystore "$release_key" --alias "$CINNY_ANDROID_KEY_ALIAS" \
              --report "android-artifacts/$suffix-signing.json"
          done
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee android-artifacts/android-signature.txt
          python3 - <<'VERIFY'
          import pathlib,re
          expected=pathlib.Path('android-signing-certificate.sha256').read_text().strip().lower()
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)',pathlib.Path('android-artifacts/android-signature.txt').read_text()).group(1).lower()
          assert actual==expected, 'Android signing identity mismatch'
          VERIFY
          "$tools/zipalign" -c -P 16 4 "$apk"
          cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab "$aab"
          jarsigner -keystore "$release_key" -storepass:env CINNY_ANDROID_STORE_PASSWORD -keypass:env CINNY_ANDROID_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$CINNY_ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$aab" > android-artifacts/android-bundle-signature.txt
          grep 'jar verified' android-artifacts/android-bundle-signature.txt
          "$tools/aapt" dump badging "$apk" > android-artifacts/android-package.txt
          head -n 8 android-artifacts/android-package.txt
          "$tools/aapt" dump permissions "$apk" > android-artifacts/android-permissions.txt
          grep 'android.permission.CAMERA' android-artifacts/android-permissions.txt
          grep 'android.permission.RECORD_AUDIO' android-artifacts/android-permissions.txt
          grep 'android.permission.MODIFY_AUDIO_SETTINGS' android-artifacts/android-permissions.txt
          grep "versionCode='4013002' versionName='4.13.2'" android-artifacts/android-package.txt
      - name: Verify packaged adaptive and themed launcher icons
        run: |
          python3 - <<'ICON_CHECK'
          import os,re,subprocess,json
          from pathlib import Path
          tools=Path(os.environ.get('ANDROID_HOME','/tmp/cinny-android-sdk'))/'build-tools/36.0.0'
          apk=Path(os.environ.get('CINNY_ICON_APK','android-artifacts/Cinny_4.13.2_android.apk'))
          out=Path(os.environ.get('CINNY_ICON_OUTPUT','android-artifacts'));out.mkdir(parents=True,exist_ok=True)
          resources=subprocess.check_output([str(tools/'aapt2'),'dump','resources',str(apk)],text=True)
          foreground=re.search(r'resource (0x[0-9a-f]+) drawable/ic_cinny_foreground\b',resources).group(1)
          background=re.search(r'resource (0x[0-9a-f]+) drawable/ic_cinny_background\b',resources).group(1)
          report=[]
          for name in ['ic_launcher','ic_launcher_round']:
           block=re.search(r'(?m)^    resource \S+ mipmap/'+name+r'\n((?:      .*\n)+)',resources).group(1)
           variants=dict(re.findall(r'\(([^)]*)\) \(file\) (\S+) type=XML',block))
           for label in ['adaptive','themed']:
            candidates=[(cfg,path) for cfg,path in variants.items() if cfg.startswith('anydpi') and (('v33' in cfg)==(label=='themed'))]
            assert len(candidates)==1,(name,label,variants)
            cfg,path=candidates[0]
            xml=subprocess.check_output([str(tools/'aapt'),'dump','xmltree',str(apk),path],text=True)
            assert 'E: adaptive-icon' in xml and 'E: foreground' in xml and 'E: background' in xml
            assert '@'+foreground in xml and '@'+background in xml
            assert ('E: monochrome' in xml)==(label=='themed')
            (out/(name+'-'+label+'.txt')).write_text(xml)
            report.append({'resource':name,'configuration':cfg,'file':path,'monochrome':label=='themed'})
          (out/'android-icon-resources.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS compiled adaptive/round/themed icons reference Cinny vector layers after resource optimization')
          ICON_CHECK
      - name: Collect packages and generated native source
        if: always()
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} android-artifacts/ \; || true
          tar -czf android-artifacts/generated-android-source.tar.gz --exclude=build --exclude=.gradle src-tauri/gen/android
      - name: Install Android WebView test client
        run: python3 -m pip install websocket-client==1.9.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download previous signed APK for Android 13 upgrade regression
        run: |
          curl -fL --retry 3 https://github.com/agpopov/cinny-desktop/releases/download/v4.12.19/Cinny_4.12.19_android.apk -o "$RUNNER_TEMP/cinny-previous.apk"
          echo "9a2fb2503b9ab96fc34c2deacbeb10dea4cb60c18e7671dbc86a6f05c0242629  $RUNNER_TEMP/cinny-previous.apk" | sha256sum -c -
      - name: Android 13 release installation and update regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            python3 tests/e2e/android_install.py --serial emulator-5554 --api 33 --apk android-artifacts/Cinny_4.13.2_android.apk --previous-apk "$RUNNER_TEMP/cinny-previous.apk" --output android-artifacts/api33-installation
            adb shell am force-stop in.cinny.app
            adb install --no-streaming -r android-artifacts/Cinny_4.13.2_android-x86_64.apk
            adb uninstall in.cinny.app
            adb install --no-streaming android-artifacts/Cinny_4.13.2_android-x86_64.apk
      - name: Native Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-artifacts/Cinny_4.13.2_android.apk
            adb shell am start -n in.cinny.app/.MainActivity
            sleep 25
            adb shell pidof in.cinny.app
            ANDROID_TEST_VARIANT=native-release PYTHONPATH=tests/e2e python3 -c "from android_native import dump_ui; dump_ui('/sdcard/release-window.xml')"
            adb pull /sdcard/release-window.xml android-artifacts/android-release-startup.xml
            adb exec-out screencap -p > android-artifacts/android-release-startup.png
            ANDROID_TEST_VARIANT=native-release python3 tests/e2e/android_native.py
            adb shell am force-stop in.cinny.app
            adb uninstall in.cinny.app
            adb install -r android-artifacts/app-universal-debug.apk
            adb shell am start -n in.cinny.app/.MainActivity
            sleep 25
            adb shell pidof in.cinny.app
            python3 tests/e2e/android_native.py
            PYTHONPATH=tests/e2e python3 -c "from android_native import dump_ui; dump_ui('/sdcard/window.xml')"
            adb pull /sdcard/window.xml android-artifacts/android-startup.xml
            adb exec-out screencap -p > android-artifacts/android-startup.png
            adb logcat -d > android-artifacts/android-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*in.cinny.app|Process: in.cinny.app.*PID' android-artifacts/android-logcat.txt
      - name: Android checksums
        if: always()
        run: python3 -c 'import hashlib,pathlib; d=pathlib.Path("android-artifacts"); (d/"SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in sorted(d.iterdir()) if p.suffix in [".apk",".aab"]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinny-4.13.2-android-release
          path: android-artifacts/
          if-no-files-found: error
