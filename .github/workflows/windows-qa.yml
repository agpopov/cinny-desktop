name: Corp Windows packaged app validation
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Windows build run containing the NSIS package to validate
        required: true
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: cinny-desktop-windows
          path: packages
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Install and validate the packaged application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-artifacts | Out-Null
          git rev-parse HEAD | Set-Content windows-artifacts/test-source.txt
          Copy-Item packages/windows-artifacts/desktop-source.txt windows-artifacts/desktop-source.txt
          Copy-Item packages/windows-artifacts/web-source.txt windows-artifacts/web-source.txt
          python -m pip install playwright==1.64.0
          $installer = Get-ChildItem packages/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          $env:CINNY_BINARY = Join-Path $env:LOCALAPPDATA 'Cinny/cinny.exe'
          if (!(Test-Path $env:CINNY_BINARY)) { throw "Installed binary missing: $env:CINNY_BINARY" }
          python tests/e2e/windows_native.py | Tee-Object windows-artifacts/native-test.log
          if ($LASTEXITCODE -ne 0) { throw "Native Windows test failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qa-${{ github.run_id }}
          path: |
            windows-artifacts/*.txt
            windows-artifacts/*.json
            windows-artifacts/*.log
            windows-artifacts/*.png
