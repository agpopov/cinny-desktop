name: Corp platform builds
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source tag or commit (empty means the selected workflow commit)
        required: false
        default: ''
      release_tag:
        description: Package version to validate
        required: true
        default: v4.13.4
      platform:
        description: Platforms to build
        type: choice
        options: [all, linux, macos]
        default: all
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'macos' && fromJSON('["macos-universal"]') || inputs.platform == 'linux' && fromJSON('["linux-x86_64"]') || fromJSON('["linux-x86_64","macos-universal"]') }}
    runs-on: ${{ matrix.platform == 'macos-universal' && 'macos-15-intel' || 'ubuntu-22.04' }}
    steps:
      - name: Resolve source to immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BUILD_SOURCE_REF" --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick dbus-x11 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-gl webkit2gtk-driver x11-xserver-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install dependencies and test read handling
        run: |
          npm ci
          npm ci --prefix cinny
          rustc --test tests/wry_frame_guard.rs -o "$RUNNER_TEMP/wry-frame-tests"
          "$RUNNER_TEMP/wry-frame-tests"
          npm run test:unread:source --prefix cinny
          npm run test:mentions --prefix cinny
          npm run test:media --prefix cinny
          npm run test:stickers --prefix cinny
          npm run test:key-export --prefix cinny
          npm run test:p1 --prefix cinny
          npm run test:p2 --prefix cinny
          npm run test:routes --prefix cinny
          npm run test:clipboard --prefix cinny
          npm run test:editor-links --prefix cinny
          npm run test:composer --prefix cinny
          npm run test:client-fixes --prefix cinny
          npm run typecheck --prefix cinny
      - name: Record source provenance
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p platform-artifacts
          git rev-parse HEAD > platform-artifacts/desktop-source.txt
          git -C cinny rev-parse HEAD > platform-artifacts/web-source.txt
          node -e 'const p=require("./package.json"); if ("v"+p.version!==process.env.RELEASE_TAG) throw Error("Release version mismatch")'
      - name: Build Linux packages
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles deb,appimage
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb platform-artifacts/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage platform-artifacts/
          dpkg-deb --info platform-artifacts/*.deb
      - name: Linux native launch smoke test
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- bash -euc '
            src-tauri/target/x86_64-unknown-linux-gnu/release/cinny > platform-artifacts/native-launch.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              kill -0 "$app_pid"
              if xdotool search --onlyvisible --name Cinny >/dev/null 2>&1; then break; fi
              sleep 1
            done
            xdotool search --onlyvisible --name Cinny
            sleep 15
            kill -0 "$app_pid"
            import -window root platform-artifacts/linux-startup.png
          '
      - name: Linux screenshot clipboard regression in the packaged WebView
        if: runner.os == 'Linux'
        run: |
          cinny/node_modules/.bin/esbuild cinny/tests/fixtures/clipboard-probe.ts --bundle --format=iife --platform=browser --outfile="$RUNNER_TEMP/clipboard-probe.js"
          CINNY_BINARY="$PWD/src-tauri/target/x86_64-unknown-linux-gnu/release/cinny" CLIPBOARD_PROBE="$RUNNER_TEMP/clipboard-probe.js" TEST_OUTPUT="$PWD/platform-artifacts/clipboard" dbus-run-session -- python3 cinny/tests/e2e/linux_clipboard.py
      - name: Build macOS Universal packages with ad-hoc signing
        if: runner.os == 'macOS'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          echo '{"bundle":{"macOS":{"minimumSystemVersion":"11.0","signingIdentity":"-"}}}' > src-tauri/tauri.platform-ci.conf.json
          npm run tauri -- build --target universal-apple-darwin --bundles app --config src-tauri/tauri.platform-ci.conf.json
          version="$(node -p 'require("./package.json").version')"
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app
          ditto -c -k --sequesterRsrc --keepParent "$app" "platform-artifacts/Cinny_${version}_universal.app.zip"
          # Package without the Finder/AppleScript layout step, which fails on headless runners.
          dmg_stage="$(mktemp -d)"
          ditto "$app" "$dmg_stage/Cinny.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -volname "Cinny $version" -srcfolder "$dmg_stage" -ov -format UDZO "platform-artifacts/Cinny_${version}_universal.dmg"
          hdiutil verify "platform-artifacts/Cinny_${version}_universal.dmg"
          lipo -archs src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app/Contents/MacOS/cinny
          codesign --verify --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app/Contents/Info.plist
      - name: macOS native launch smoke test
        if: runner.os == 'macOS'
        run: |
          open src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny.app
          sleep 20
          pgrep -x cinny
          screencapture -x platform-artifacts/macos-startup.png
          pkill -x cinny
      - name: Checksums
        run: python3 -c 'import hashlib,pathlib; d=pathlib.Path("platform-artifacts"); (d/"SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in sorted(d.iterdir()) if p.suffix in [".deb",".AppImage",".dmg",".zip"]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinny-${{ inputs.release_tag }}-${{ matrix.platform }}
          path: platform-artifacts/
          if-no-files-found: error
