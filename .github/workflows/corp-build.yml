name: "Corp build (Windows)"
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable # branch-based releases
      - name: Install cinny dependencies
        run: cd cinny && npm ci
      - name: Test unread receipt handling
        run: cd cinny && npm run test:unread && npm run test:mentions && npm run typecheck
      - name: Install tauri dependencies
        run: npm ci
      - name: Build desktop app with Tauri
        run: npm run tauri build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
      - name: Install and validate the Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-artifacts | Out-Null
          git rev-parse HEAD | Set-Content windows-artifacts/desktop-source.txt
          git -C cinny rev-parse HEAD | Set-Content windows-artifacts/web-source.txt
          python -m pip install playwright==1.64.0
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          $env:CINNY_BINARY = Join-Path $env:LOCALAPPDATA 'Cinny/cinny.exe'
          if (!(Test-Path $env:CINNY_BINARY)) { throw "Installed binary missing: $env:CINNY_BINARY" }
          python tests/e2e/windows_native.py | Tee-Object windows-artifacts/native-test.log
          if ($LASTEXITCODE -ne 0) { throw "Native Windows test failed: $LASTEXITCODE" }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinny-desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            windows-artifacts/*.txt
            windows-artifacts/*.log
            windows-artifacts/*.json
            windows-artifacts/*.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
