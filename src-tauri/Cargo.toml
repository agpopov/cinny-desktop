# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "cinny"
version = "4.14.2"
description = "Yet another matrix client"
authors = ["Ajay Bura"]
license = "AGPL-3.0-only"
repository = "https://github.com/cinnyapp/cinny-desktop"
default-run = "cinny"
edition = "2021"
rust-version = "1.61"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.109"
serde = { version = "1.0.193", features = ["derive"] }
tauri = { version = "2.11.2", features = [ "devtools", "image-png"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2.5.9"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
base64 = "0.22"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
updater = [ "tauri-plugin-updater" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-localhost = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.10.1", features = ["rustls-tls"], optional = true }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = "=4.18.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Keep the locked Wry version and backport main-frame-only initialization.
[patch.crates-io]
wry = { path = "vendor/wry" }
